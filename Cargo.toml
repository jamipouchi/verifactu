[workspace]
resolver = "2"
# The `verifactu` crate: the one-crate facade for sending Veri*FACTU
# records to AEAT. This repo is the crate and everything it needs to
# build — nothing else.
members = [
    "crates/verifactu",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Async + HTTP
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net"] }
axum = { version = "0.8", features = ["http1", "json"] }
http = "1"
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tower-service = "0.3"
bytes = "1"

# TLS family (ring provider, TLS12 kept)
rustls = { version = "=0.23.39", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "=0.13.2", default-features = false, features = ["pem", "ring"] }
webpki-roots = "=1.0.0"

# Serialization / domain correctness
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
rust_decimal = { version = "1.38", features = ["serde", "serde-arbitrary-precision"] }
rust_decimal_macros = "1.38"
sha2 = "0.10"
hex = "0.4"

# Errors
thiserror = "2.0"

# Test lattice
proptest = "1.7"
insta = { version = "1.43", features = ["yaml"] }

# Signing stack — vendored (see [patch.crates-io] below)
bergshamra-c14n = "=0.9.2"
bergshamra-dsig = { version = "=0.9.2", default-features = false, features = ["rustcrypto"] }
bergshamra-keys = { version = "=0.9.2", default-features = false, features = ["rustcrypto"] }
bergshamra-crypto = { version = "=0.9.2", default-features = false, features = ["rustcrypto"] }
bergshamra-pkcs12 = "=0.9.2"
uppsala = "=0.10.1"
x509-cert = "=0.2.5"
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny" }
pedantic = { level = "warn" }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = "symbols"

# The bergshamra signing family resolves to the committed source under
# third_party/vendor/, never to crates.io.
[patch.crates-io]
bergshamra-c14n = { path = "third_party/vendor/bergshamra-c14n" }
bergshamra-core = { path = "third_party/vendor/bergshamra-core" }
bergshamra-crypto = { path = "third_party/vendor/bergshamra-crypto" }
bergshamra-dsig = { path = "third_party/vendor/bergshamra-dsig" }
bergshamra-keys = { path = "third_party/vendor/bergshamra-keys" }
bergshamra-pkcs12 = { path = "third_party/vendor/bergshamra-pkcs12" }
bergshamra-transforms = { path = "third_party/vendor/bergshamra-transforms" }
bergshamra-xml = { path = "third_party/vendor/bergshamra-xml" }
uppsala = { path = "third_party/vendor/uppsala" }
kryptering = { path = "third_party/vendor/kryptering" }
tsp-ltv = { path = "third_party/vendor/tsp-ltv" }

# Ride stable deliberately: the toolchain moves when someone runs
# `rustup update`, and the gates in AGENTS.md (fmt, clippy -D warnings,
# the test matrix) are re-run on the new toolchain before anything else
# lands. No exact-version pin: six-weekly churn for no added safety.
[toolchain]
channel = "stable"
profile = "minimal"
components = ["rustfmt", "clippy"]
